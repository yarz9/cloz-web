<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store — Cloz Optimizer</title>
  <meta http-equiv="refresh" content="4;url=https://discord.gg/zBp34yu2hf"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: #0a0a0f; color: #f0f0ff;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .box {
      background: #16162a; border: 1px solid #2a2a45;
      border-radius: 20px; padding: 60px 48px; max-width: 480px;
    }
    .icon { font-size: 3rem; margin-bottom: 24px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; }
    p { color: #8888aa; font-size: 0.95rem; line-height: 1.7; margin-bottom: 32px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #9d5ff3);
      color: #fff; padding: 13px 32px; border-radius: 10px;
      font-weight: 700; text-decoration: none; font-size: 0.95rem;
      box-shadow: 0 0 32px rgba(124,58,237,0.35);
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
    .redirect-note {
      margin-top: 20px; font-size: 0.78rem; color: #555;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🛒</div>
    <h1>Store Coming Soon</h1>
    <p>Our official store is being set up. In the meantime, you can purchase a license key directly through our Discord server. A staff member will assist you.</p>
    <a href="https://discord.gg/zBp34yu2hf" target="_blank">Open Discord Server</a>
    <p class="redirect-note">Redirecting you to Discord in a few seconds...</p>
  </div>
</body>
</html>
